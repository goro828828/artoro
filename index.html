<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ARTORO（アートロ）｜すれ違いで作品を交換するアプリのWeb版デモ">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F4553B'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
<title>ARTORO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
/* Layout: one white phone column (max 480px) based on the Figma HOME screen; black baroque frames hold the works; floating pill tab bar.
   Deliberately single light theme, matching the Figma mock. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --bg2:#F4F4F4; --bg3:#E9E9E9; --ink:#121212; --muted:#8B8B8B; --line:#EAEAEA;
  --coral:#F4553B; --blue:#4A9BF5; --lime:#B5D80F; --yellow:#FFC234; --cream:#FFF4DC;
  --shadow:0 6px 22px rgba(0,0,0,.08);
  --f-latin:"Outfit","M PLUS Rounded 1c",system-ui,sans-serif;
  --f-jp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --nav-h:64px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-jp);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
img{display:block}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pad-nav{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- tab bar ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;pointer-events:none;padding:0 max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(20px,env(safe-area-inset-left,0px))}
.nav nav{pointer-events:auto;max-width:400px;margin:0 auto;height:50px;background:var(--bg);border-radius:25px;box-shadow:0 4px 18px rgba(0,0,0,.1);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;justify-items:center}
.nav button{width:48px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--ink);transition:background .2s}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{background:var(--coral);color:#fff}

/* ---------- headers ---------- */
.hhead{display:flex;justify-content:space-between;align-items:flex-start;padding-top:18px;gap:12px}
.hhead h1{font-family:var(--f-latin);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1.1}
.today{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;margin-top:8px}
.today::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--lime)}
.today b{font-family:var(--f-latin);font-variant-numeric:tabular-nums}
.hright{display:grid;justify-items:end;gap:8px}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.iconbtn .dot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--bg)}
.chead{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:grid;grid-template-columns:72px 1fr 72px;align-items:center;height:54px}
.chead .t{text-align:center;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .t.brand{font-family:var(--f-latin);font-weight:600;letter-spacing:.14em;color:#555}
.chead .r{justify-self:end}
.back{display:inline-flex;align-items:center;gap:2px;font-size:13px;color:#444;height:40px}
.back svg{width:18px;height:18px}
.chead.shadow{box-shadow:0 2px 8px rgba(0,0,0,.06)}

/* ---------- mode switch (pass <-> map) ---------- */
.mode{width:76px;height:42px;position:relative;background:none;filter:drop-shadow(0 2px 6px rgba(181,216,15,.45));transition:filter .35s}
.mode::before{content:"";position:absolute;top:7px;left:22px;width:54px;height:28px;border-radius:14px;background:linear-gradient(90deg,#A8D00A,#DDF27A);transition:left .35s cubic-bezier(.4,1.4,.5,1),background .35s}
.mode .knob{position:absolute;top:0;left:0;width:42px;height:42px;border-radius:50%;background:#fff;border:5px solid var(--lime);box-sizing:border-box;display:grid;place-items:center;transition:transform .35s cubic-bezier(.4,1.4,.5,1),border-color .35s;box-shadow:inset 0 1px 3px rgba(0,0,0,.12)}
.mode .knob svg{width:20px;height:20px}
.mode[aria-checked="true"]{filter:drop-shadow(0 2px 6px rgba(74,155,245,.4))}
.mode[aria-checked="true"]::before{left:0;background:linear-gradient(90deg,#8EC2FF,#3D8BF0)}
.mode[aria-checked="true"] .knob{transform:translateX(34px);border-color:var(--blue)}
.whiteout{position:fixed;inset:0;z-index:95;background:var(--cream);opacity:0;pointer-events:none;transition:opacity .28s ease}
.whiteout.on{opacity:1}

/* ---------- frame ---------- */
.frame{position:relative;width:100%;filter:drop-shadow(0 8px 10px rgba(0,0,0,.28));container-type:inline-size}
.frame img.art{position:absolute;object-fit:cover;background:var(--bg3)}
.frame svg.fr{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
/* サムネの目印（相手の美術館とマイ美術館の中だけで表示）：額縁の左上から下がる黄色いしおりに、濃い茶色の文字で「サムネ」 */
.ribbon{position:absolute;z-index:2;padding:.4em .5em 1em;font-size:9px;font-size:clamp(6px,5.2cqw,12px);font-weight:800;line-height:1;letter-spacing:.04em;white-space:nowrap;color:#5A3D00;background:linear-gradient(90deg,#F5B01E,#FFC93F 45%,#F5B01E);clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - .6em),0 100%);filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}

/* ---------- carousel ---------- */
.car{--iw:min(60vw,272px);display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;padding:26px calc((100% - var(--iw))/2) 18px;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));min-height:calc(var(--iw) * 1.38)}
.car::-webkit-scrollbar{display:none}
.car-item{flex:0 0 var(--iw);scroll-snap-align:center;display:grid;place-items:center;transform-origin:center;will-change:transform;padding:0 4px}
.car-empty{display:grid;justify-items:center;gap:12px;text-align:center;color:var(--muted);padding:60px 16px}

/* ---------- info card ---------- */
.info{background:var(--bg);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);padding:10px 12px 12px;display:grid;gap:7px}
.info .ttl{background:var(--bg2);border-radius:10px;text-align:center;font-family:var(--f-latin);font-weight:500;font-size:17px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .cap{margin:0;font-size:12.5px;color:#333;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .cap.full{display:block;white-space:pre-wrap}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{background:var(--blue);color:#fff;font-size:10.5px;font-weight:700;border-radius:8px;padding:1px 8px}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);align-items:center}
.meta span{display:inline-flex;align-items:center;gap:3px}
.meta svg{width:13px;height:13px}
.meta .pass{color:#6C8A00;font-weight:700}
.meta .gacha{color:#B47F00;font-weight:700}
.demo{display:flex;justify-content:center;padding-top:14px}
.linkbtn{font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:16px;background:var(--bg2)}
.linkbtn svg{width:15px;height:15px}
.linkbtn:disabled{opacity:.5}
/* すれ違い：美術館で1点もらう */
.pickst{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue);background:#E8F2FE;border-radius:10px;padding:6px 10px}
.pickst svg{width:15px;height:15px;flex:none}
.pickst .chev{margin-left:auto}
.pickst.done{color:#5E7A00;background:#F1F8D6}
.pickbar{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;border-radius:12px;background:#E8F2FE;color:#1F5FAE;font-size:12px}
.pickbar svg{width:20px;height:20px;flex:none}
.pickbar b{display:block;font-size:13px;color:var(--ink)}
.pickbar.done{background:#F1F8D6;color:#5E7A00}
.wbadge{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);z-index:3;font-size:10px;font-weight:800;padding:2px 9px;border-radius:9px;background:var(--ink);color:#fff;white-space:nowrap}
.wbadge.got{background:var(--lime);color:#2C3A00}

/* ---------- map ---------- */
.map{position:relative;margin-top:14px;height:calc(100svh - 230px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:360px;max-height:640px;border-radius:22px;overflow:hidden;background:#EEF0F2;touch-action:none;user-select:none}
.map .world{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .55s cubic-bezier(.3,.9,.3,1)}
.map .world img{width:900px;height:1100px;max-width:none}
.pin{position:absolute;width:74px;transform:translate(-50%,-100%);transition:transform .55s cubic-bezier(.3,.9,.3,1),opacity .3s,left .55s cubic-bezier(.3,.9,.3,1),top .55s cubic-bezier(.3,.9,.3,1);display:grid;justify-items:center;gap:8px}
.map.dragging .world,.map.dragging .pin{transition:none}
.pin .pdot{width:11px;height:11px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 3px rgba(255,194,52,.3)}
.pin.sel{transform:translate(-50%,-100%) scale(1.75);z-index:5}
.map.zoomed .pin:not(.sel){opacity:0;pointer-events:none}
.map .mcard{position:absolute;left:12px;right:12px;bottom:12px;z-index:8;transform:translateY(130%);transition:transform .45s cubic-bezier(.3,.9,.3,1)}
.map.zoomed .mcard{transform:none}
.map .hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(255,255,255,.92);font-size:11px;font-weight:700;padding:4px 12px;border-radius:12px;color:#555;white-space:nowrap;transition:opacity .3s}
.map.zoomed .hint{opacity:0}

/* ---------- pages (pushed screens) ---------- */
.page{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;animation:slide .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(26%);opacity:.3}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.92);opacity:0}}

/* museum wall */
.wall{position:relative;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.wall::-webkit-scrollbar{display:none}
.wall .inner{position:relative;height:100%}
.wall .w{position:absolute;display:block;transition:left .25s ease,top .25s ease,transform .2s ease}
/* マイ美術館：長押しで持ち上げて並べ替え／点線の＋で作品を追加 */
.wall .w.pressing{transform:scale(.96);transition:transform .45s ease}
.wall .w.lift{z-index:20;transition:none;transform:scale(1.07);filter:drop-shadow(0 16px 18px rgba(0,0,0,.35));cursor:grabbing}
.wall.dragging{cursor:grabbing}
.addtile{position:absolute;display:grid;place-content:center;justify-items:center;gap:6px;aspect-ratio:4/5.2;border:2px dashed #C4C4C4;border-radius:14px;color:#9A9A9A;font-size:11px;font-weight:700;background:rgba(0,0,0,.015);transition:left .25s ease,top .25s ease}
.addtile svg{width:30px;height:30px}
.addtile:hover{border-color:var(--coral);color:var(--coral)}
.mgrid .addtile{position:relative}
.album{cursor:pointer}
.album .heart{width:26px;height:26px;margin:-5px -2px -5px -6px;display:grid;place-items:center;border-radius:50%;color:#444}
.album .heart svg{width:15px;height:15px}
.album .heart.on{color:var(--coral)}
.album .heart.on svg path{fill:currentColor}
.album .ah .ttl2{display:inline-flex;align-items:center;gap:4px;min-width:0}
.passchip{font-size:9.5px;font-weight:800;color:#fff;background:var(--coral);border-radius:8px;padding:1px 7px;margin-left:2px;white-space:nowrap}
.inp-dlg{width:100%;border:0;background:var(--bg2);border-radius:10px;padding:10px 12px;font-size:14px;margin:4px 0 12px}
.inp-dlg:focus{outline:2px solid var(--blue)}
.prog{height:4px;border-radius:2px;background:var(--bg3);margin:18px 8px 0;position:relative;overflow:hidden}
.prog i{position:absolute;top:0;bottom:0;left:0;border-radius:2px;background:#888}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:26px 22px;padding-top:16px;align-items:center}
.wall-owner{display:flex;align-items:center;gap:10px;padding:6px 0 4px}
.wall-owner img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.wall-owner b{font-size:14px}
.wall-owner span{font-size:11px;color:var(--muted);display:block;line-height:1.2}

/* detail */
.dimg{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:var(--shadow)}
.dimg img{width:100%;height:auto;max-height:62vh;object-fit:contain;background:var(--bg2)}
.drow{display:grid;gap:12px;padding-top:12px}
.place{border-radius:12px;background:var(--bg2);padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;align-items:center}
.place svg{width:20px;height:20px;grid-row:span 2}
.place b{font-size:13px}
.place.pass svg{color:#7DA000}
.place.gacha svg{color:#C68A00}
.place span{color:var(--muted)}
.byline{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);text-align:left;width:100%}
.byline img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.byline div{flex:1;min-width:0;line-height:1.25}
.byline span{font-size:11px;color:var(--muted)}
.byline svg{width:16px;height:16px;color:var(--muted)}
.pillbtns{display:flex;justify-content:center;gap:14px;padding-top:22px}
.pbtn{height:34px;min-width:92px;padding:0 20px;border-radius:17px;font-size:12.5px;font-weight:700;background:#B9B9B9;color:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.pbtn.red{background:var(--coral)}
.pbtn.blue{background:var(--blue)}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(240,240,240,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .2s;padding:24px}
.dialog{width:min(300px,100%);background:var(--bg);border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.18);padding:20px 16px 16px;text-align:center;display:grid;gap:6px;animation:pop .22s}
.dialog h2{font-size:15px;margin:0}
.dialog p{margin:0 0 10px;font-size:12.5px;color:#555}
.dialog .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dialog .row button{height:36px;border-radius:18px;background:var(--bg2);font-weight:700;font-size:13px}
.dialog .row .del{color:var(--coral)}

/* ---------- gacha ---------- */
.coins{position:absolute;right:0;top:66px;z-index:5;background:var(--blue);color:#fff;border-radius:18px 0 0 18px;height:34px;padding:0 14px 0 6px;display:flex;align-items:center;gap:6px;font-family:var(--f-latin);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.coin{width:24px;height:24px;flex:none}
.catrow{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:30px}
.cat{height:38px;min-width:124px;padding:0 22px;border-radius:19px;color:#fff;font-weight:800;font-size:17px;letter-spacing:.04em;transition:background .3s}
.arrow{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#9a9a9a}
.arrow svg{width:20px;height:20px}
.stage{position:relative;height:330px;display:grid;place-items:center;touch-action:pan-y}
.stage svg.globe{width:300px;height:300px;max-width:100%;overflow:visible;animation:bob 4s ease-in-out infinite;position:relative;z-index:1}
.stage .shadow{position:absolute;bottom:2px;left:50%;width:210px;height:56px;transform:translateX(-50%);border-radius:50%;background:#A9C1F7;filter:blur(12px);opacity:.85;animation:shadow 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes shadow{50%{transform:translateX(-50%) scale(.9);opacity:.6}}
.stage.spin svg.globe{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:translate(-3px,1px) rotate(-1.5deg)}75%{transform:translate(3px,-1px) rotate(1.5deg)}}
.gbox{border:2px solid var(--blue);border-radius:16px;padding:10px 14px 12px;display:grid;justify-items:center;gap:6px;margin-top:4px}
.gbtn{width:100%;max-width:260px;height:42px;border-radius:21px;background:var(--blue);color:#fff;font-weight:800;font-size:17px;letter-spacing:.06em;box-shadow:0 4px 10px rgba(74,155,245,.35)}
.gbtn:disabled{background:#B9CDE6;box-shadow:none}
.gline{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.gline .coin{width:20px;height:20px}
.minicat{height:22px;padding:0 14px;border-radius:11px;color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center}
.gsub{font-size:11px;font-weight:700}
.gnote{font-size:11px;color:var(--muted);text-align:center;margin:8px 0 0}
/* gacha: rainbow launch → tap the globe */
.rainbow{position:fixed;inset:0;z-index:96;pointer-events:none;overflow:hidden}
/* 斜め45°に回した枠の中で、色の帯が左下→右上へ次々に飛ぶ。真ん中のタイミングで画面を埋め尽くす */
.rainbow .lane{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-45deg)}
.rainbow .bar{position:absolute;left:0;border-radius:999px;transform:translateX(-105%);animation:barFly var(--d) var(--delay) cubic-bezier(.45,.05,.4,1) forwards}
@keyframes barFly{0%{transform:translateX(-105%)}40%{transform:translateX(-34%)}62%{transform:translateX(-6%)}100%{transform:translateX(75%)}}
.tapcall{padding-top:34px;text-align:center;font-weight:800;font-size:28px;letter-spacing:.06em;color:var(--coral);animation:tapBounce 1s ease-in-out infinite}
.tapcall.hit{animation:none;color:var(--blue)}
@keyframes tapBounce{50%{transform:scale(1.08)}}
.stage.tap{height:400px;cursor:pointer;outline-offset:-8px}
.stage .ring{position:absolute;top:50%;left:50%;width:230px;height:230px;margin:-115px;border-radius:50%;border:4px solid rgba(74,155,245,.55);animation:tapRing 1.4s ease-out infinite;pointer-events:none}
.stage .finger{position:absolute;left:calc(50% + 62px);top:calc(50% + 40px);width:58px;height:58px;z-index:3;pointer-events:none;animation:tapFinger 1s ease-in-out infinite}
.stage.spin .ring,.stage.spin .finger{display:none}
@keyframes tapRing{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.3);opacity:0}}
@keyframes tapFinger{50%{transform:translate(-7px,-7px) scale(.9)}}
.tapnote{font-size:12px;font-weight:700}

/* draw overlay */
.draw{position:fixed;inset:0;z-index:85;background:rgba(255,248,232,.97);display:grid;place-items:center;overflow:hidden;animation:fade .3s}
.draw .rays{position:absolute;width:900px;height:900px;left:50%;top:40%;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,194,52,.28) 0 9deg,transparent 9deg 22deg);border-radius:50%;opacity:0;animation:rays 1s .9s forwards,turn 18s linear infinite;-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%)}
@keyframes rays{to{opacity:1}}
@keyframes turn{to{rotate:360deg}}
.draw .col{position:relative;display:grid;justify-items:center;gap:16px;width:min(320px,86vw);padding:0 16px}
.env{position:relative;width:220px;height:150px;margin-top:175px;animation:fly .8s cubic-bezier(.2,1.3,.4,1) both}
@keyframes fly{from{transform:translate(0,-38vh) scale(.15) rotate(-30deg);opacity:0}}
.env .back2{position:absolute;inset:0;background:#EFE8DA;border-radius:8px;z-index:1}
.env .body{position:absolute;inset:0;background:#FFFFFF;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:3;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;background:#F6F1E6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;animation:flap .45s .85s ease-in forwards}
.env .seal{position:absolute;left:50%;top:48%;width:26px;height:26px;margin:-13px;border-radius:50%;background:var(--coral);z-index:5;animation:sealoff .2s .8s forwards;box-shadow:0 2px 4px rgba(0,0,0,.2)}
@keyframes flap{to{transform:rotateX(180deg);z-index:0}}
@keyframes sealoff{to{transform:scale(0)}}
.env .card{position:absolute;left:50%;bottom:10px;width:150px;margin-left:-75px;z-index:2;transform-origin:50% 100%;animation:rise .9s 1.25s cubic-bezier(.2,1.2,.4,1) both}
/* 底を基準に縮めて封筒の中に収め、出てきた後も下の端は封筒の中に差し込んだままにする */
@keyframes rise{from{transform:translateY(0) scale(var(--s0,.6))}to{transform:translateY(-118px) scale(var(--s1,1.2))}}
.draw .txt{display:grid;justify-items:center;gap:4px;text-align:center;animation:fade .4s 2s both}
.draw .txt small{font-size:12px;color:#9a7a2a;font-weight:700;letter-spacing:.08em;font-family:var(--f-latin)}
.draw .txt b{font-family:var(--f-latin);font-size:22px;font-weight:600}
.draw .txt span{font-size:12px;color:#666}
.draw .btns{display:flex;gap:12px;animation:fade .4s 2.2s both}

/* ---------- my page ---------- */
.prof{display:flex;align-items:center;gap:14px;padding-top:10px}
.prof .av{width:50px;height:50px;border-radius:50%;object-fit:cover;background:var(--bg3);flex:none}
.prof .nm{flex:1;min-width:0;line-height:1.25}
.prof .nm b{font-family:var(--f-latin);font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.prof .nm b svg{width:16px;height:16px;color:var(--lime)}
.prof .nm span{display:block;font-size:11px;color:var(--muted)}
.editbtn{height:30px;padding:0 14px;border-radius:15px;border:1px solid var(--line);font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px;box-shadow:0 2px 6px rgba(0,0,0,.05);white-space:nowrap}
.editbtn svg{width:13px;height:13px}
.ptabs{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.ptabs button{height:40px;font-size:12px;font-weight:700;color:#777;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--coral);border-bottom-color:var(--coral)}
.filt{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.filt::-webkit-scrollbar{display:none}
.filt button{flex:none;height:24px;padding:0 12px;border-radius:12px;background:var(--bg2);font-size:11px;font-weight:700;color:#777}
.filt button[aria-pressed="true"]{background:var(--coral);color:#fff}
.album{display:block;width:100%;background:var(--bg2);border-radius:16px;padding:10px 12px 0;margin-top:14px;text-align:left;overflow:hidden}
.album .ah{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:700;color:#444}
.album .ah span{display:inline-flex;align-items:center;gap:4px}
.album .ah svg{width:14px;height:14px}
.collage{position:relative;height:150px;margin-top:4px}
.collage .c{position:absolute;bottom:-14px}
.fab{position:fixed;z-index:35;right:max(20px,calc((100vw - 480px)/2 + 20px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 26px);width:54px;height:54px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(244,85,59,.4)}
.fab svg{width:26px;height:26px}
.empty{padding:36px 12px;text-align:center;color:var(--muted);font-size:13px;display:grid;justify-items:center;gap:12px}
.places{display:grid;gap:8px;margin-top:22px}
.places h3{font-size:12px;margin:0;color:#555}
.prow{display:flex;align-items:center;gap:10px;font-size:12px;padding:8px 10px;border-radius:12px;background:var(--bg2);text-align:left;width:100%}
.prow svg{width:18px;height:18px;color:#7DA000;flex:none}
.prow div{flex:1;min-width:0;line-height:1.3}
.prow b{display:block;font-size:13px}
.prow span{color:var(--muted)}
.prow em{font-style:normal;font-family:var(--f-latin);font-weight:600;font-size:13px}

/* form */
.formimg{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:var(--shadow);display:grid;place-items:center;min-height:180px;cursor:pointer;text-align:center;color:var(--muted);font-size:12px;gap:6px}
.formimg img{width:100%;max-height:300px;object-fit:contain;background:var(--bg2)}
.formimg.drag{outline:2px dashed var(--blue)}
.formimg .ic{width:30px;height:30px;color:#bbb}
.fld{background:#DADADA;border-radius:10px;padding:8px 10px;display:grid;gap:2px;position:relative}

.fld label svg{width:13px;height:13px}

.fld textarea{min-height:52px}
.fld .cnt{position:absolute;right:10px;top:9px;font-size:10px;color:#777;font-family:var(--f-latin)}
.fld .cnt.b{top:auto;bottom:6px}
.fld:focus-within{box-shadow:0 0 0 2px var(--blue)}

.tagsearch svg{width:14px;height:14px;color:#555;flex:none}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.sugg button{font-size:11px;font-weight:700;border-radius:10px;padding:2px 10px;background:#fff;color:#555}
.chosen{display:flex;flex-wrap:wrap;gap:6px}
.chosen button{background:var(--blue);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:2px 6px 2px 10px;display:inline-flex;align-items:center;gap:2px}
.chosen svg{width:12px;height:12px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12.5px;margin-top:10px}
.sw{width:42px;height:24px;border-radius:12px;background:#C9C9C9;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--lime)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.err{color:var(--coral);font-size:12px;margin:0;text-align:center}
.done{display:flex;justify-content:center;padding-top:20px}
.done .pbtn{background:#F01E14;min-width:108px;height:36px;border-radius:18px}

.radio[aria-checked="true"] .o::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral)}
.help{font-size:12px;color:var(--muted);margin:10px 2px 0}
.range{width:100%;accent-color:var(--coral);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.chips button{height:28px;padding:0 12px;border-radius:14px;background:var(--bg2);font-size:12px;font-weight:700;color:#666}

.flabel{font-size:11.5px;font-weight:700;color:#666;display:block;margin:0 0 4px 2px}
.brand-big{font-family:var(--f-latin);font-weight:700;font-size:40px;letter-spacing:.14em;text-align:center;padding-top:30px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px;padding:12px 2px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.nrow{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);align-items:center;width:100%;text-align:left}
.nrow img{width:38px;height:48px;object-fit:cover;border-radius:4px;flex:none}
.nrow div{flex:1;font-size:13px;line-height:1.4}
.nrow span{font-size:11px;color:var(--muted);display:block}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:99;background:rgba(18,18,18,.92);color:#fff;padding:9px 16px;border-radius:14px;font-size:12.5px;width:max-content;max-width:min(420px,calc(100% - 32px));animation:pop .2s;text-align:center}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}

    if (vert){ g.moveTo(p, -10); g.lineTo(p + a*H, H+10); } else { g.moveTo(-10, p); g.lineTo(W+10, p + a*W); } road(5 + r()*4, '#E2E5E9'); }
  for (let i = 0; i < 5; i++){ g.beginPath(); g.moveTo(-20, r()*H); g.bezierCurveTo(W*.3, r()*H, W*.7, r()*H, W+20, r()*H); road(14, '#D8DCE2'); }

let globeRAF = 0;
function runGlobe(){
  cancelAnimationFrame(globeRAF);
  const land = $('#land'), mer = $('#meridians'); if (!land) return;
  const cat = GACHA_CATS[UI.cat]; const props = cat.props.map((k, i) => ({ k, phase: i / cat.props.length * Math.PI * 2 + .6 }));
  const cx = 150, cy = 150, rx = 140, ry = 46, tilt = -18 * Math.PI / 180;
  const pt = a => { const x = rx * Math.cos(a), y = ry * Math.sin(a); return [cx + x*Math.cos(tilt) - y*Math.sin(tilt), cy + x*Math.sin(tilt) + y*Math.cos(tilt)]; };
  const arc = (a0, a1) => { let d = ''; for (let i = 0; i <= 40; i++){ const [x,y] = pt(a0 + (a1 - a0) * i / 40); d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1); } return d; };
  $('#orbitBack').setAttribute('d', arc(Math.PI, 2*Math.PI)); $('#orbitFront').setAttribute('d', arc(0, Math.PI));
  let off = 0, ang = 0, last = performance.now();
  const step = now => {
    const dt = Math.min(50, now - last); last = now; const fast = $('#stage')?.classList.contains('spin') ? 9 : 1;
    off = (off + dt * .018 * fast) % 360; ang += dt * .00045 * fast;
    land.setAttribute('transform', `translate(${off.toFixed(2)} 0)`);
    let m = ''; for (let i = 0; i < 6; i++){ const ph = ((off / 360) * Math.PI * 2 + i * Math.PI / 6) % Math.PI; m += `<ellipse cx="150" cy="150" rx="${(Math.abs(Math.cos(ph)) * 100).toFixed(1)}" ry="100"/>`; }
    mer.innerHTML = m;
    let back = '', front = '';
    props.forEach(p => { const a = ang + p.phase; const [x, y] = pt(a); const depth = Math.sin(a); const s = .78 + depth * .22;
      const g = `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})" opacity="${(.75 + depth*.25).toFixed(2)}">${propSVG(p.k)}</g>`; if (depth < 0) back += g; else front += g; });
    $('#propsBack').innerHTML = back; $('#propsFront').innerHTML = front;
    if (!reduced || fast > 1) globeRAF = requestAnimationFrame(step);
  };
  globeRAF = requestAnimationFrame(step);
  const st = $('#stage'); let sx = null;
  st.addEventListener('pointerdown', e => sx = e.clientX);
  st.addEventListener('pointerup', e => { if (!UI.gPhase && sx !== null && Math.abs(e.clientX - sx) > 40) setCat(UI.cat + (e.clientX < sx ? 1 : -1)); sx = null; });
}

// ラフどおり：7色の帯が左下から右上へ次々に飛んでいき、画面を埋め尽くしたところで画面が変わり、帯はそのまま右上へ抜ける
function rainbow(done){
  if (reduced){ done(); return; }
  const cols = ['#FF4D4D','#FF9F1C','#FFD23F','#3EC46D','#3FA9F5','#4D5BFF','#9B5DE5'];
  const W = innerWidth, H = innerHeight, D = Math.ceil(Math.hypot(W, H)) + 40, N = 21, h = D / N;
  const el = document.createElement('div'); el.className = 'rainbow'; el.setAttribute('aria-hidden', 'true');
  let bars = '';
  for (let i = 0; i < N; i++){
    const delay = (Math.random() * .15).toFixed(3), dur = (1 + Math.random() * .08).toFixed(3);
    bars += `<span class="bar" style="top:${(i * h - 3).toFixed(1)}px;height:${(h + 6).toFixed(1)}px;width:${(D * 1.6).toFixed(0)}px;background:${cols[i % cols.length]};--delay:${delay}s;--d:${dur}s"></span>`;
  }
  el.innerHTML = `<div class="lane" style="width:${D}px;height:${D}px">${bars}</div>`;
  document.body.appendChild(el);
  Sound.se('rush');
  setTimeout(done, 640);                 // 帯で画面が埋まっている間に切り替える
  setTimeout(() => el.remove(), 1400);
}

const ADD_AR = .77;
function wallLayout(ars, H){

  return { pos, total: Math.max(xt, xb) + 10 };
}

function bindReorder(P){
  const wall = $('#wall'); if (!wall || !wall.classList.contains('reorder')) return;
  const al = S.albums.find(a => a.id === P.albumId); if (!al) return;
  const inner = wall.querySelector('.inner'), H = P._H;
  let timer = null, pressEl = null, drag = null, sx = 0, sy = 0, suppress = false, raf = 0, px = 0, py = 0;
  const ar = id => { const w = S.myWorks.find(x => x.id === id); return w.aspect[0] / w.aspect[1]; };
  const relayout = () => { const { pos } = wallLayout([...drag.order.map(ar), ADD_AR], H);
    drag.order.forEach((id, i) => { if (id === drag.id) return; const el = inner.querySelector(`[data-wid="${id}"]`); el.style.left = pos[i].left + 'px'; el.style.top = pos[i].top + 'px'; });
    const t = inner.querySelector('.addtile'); if (t){ const p = pos[drag.order.length]; t.style.left = p.left + 'px'; t.style.top = p.top + 'px'; } };
  const cancelPress = () => { clearTimeout(timer); timer = null; pressEl?.classList.remove('pressing'); pressEl = null; };
  const place = () => {
    const el = drag.el, left = drag.l0 + (px - drag.x0) + (wall.scrollLeft - drag.s0), top = drag.t0 + (py - drag.y0);
    el.style.left = left + 'px'; el.style.top = top + 'px';
    const cx = left + el.offsetWidth / 2, cy = top + el.offsetHeight / 2; let best = null, bd = 1e9;
    drag.order.forEach(id => { if (id === drag.id) return; const o = inner.querySelector(`[data-wid="${id}"]`);
      const d = Math.hypot(parseFloat(o.style.left) + o.offsetWidth / 2 - cx, parseFloat(o.style.top) + o.offsetHeight / 2 - cy); if (d < bd){ bd = d; best = id; } });
    if (best && bd < Math.max(70, el.offsetWidth * .6)){ const from = drag.order.indexOf(drag.id), to = drag.order.indexOf(best);
      const to2 = al.thumbId && drag.order[0] === al.thumbId ? Math.max(1, to) : to;   // 左上（サムネの場所）には入れない
      if (from !== to2){ drag.order.splice(from, 1); drag.order.splice(to2, 0, drag.id); relayout(); } }
  };
  const tick = () => { if (!drag) return; const r = wall.getBoundingClientRect(), edge = 44;
    const v = px < r.left + edge ? -9 : px > r.right - edge ? 9 : 0; if (v){ wall.scrollLeft += v; place(); } raf = requestAnimationFrame(tick); };
  wall.addEventListener('pointerdown', e => {
    const el = e.target.closest('.w[data-wid]'); if (!el || drag || el.dataset.wid === al.thumbId) return;   // サムネは左上に固定
    sx = px = e.clientX; sy = py = e.clientY; pressEl = el; el.classList.add('pressing');
    timer = setTimeout(() => { timer = null; el.classList.remove('pressing');
      drag = { el, id: el.dataset.wid, order: al.workIds.slice(), x0: px, y0: py, l0: parseFloat(el.style.left), t0: parseFloat(el.style.top), s0: wall.scrollLeft };
      el.classList.add('lift'); wall.classList.add('dragging'); try { el.setPointerCapture(e.pointerId); } catch(_){}
      navigator.vibrate?.(15); Sound.se('lift'); suppress = true; raf = requestAnimationFrame(tick); }, 450);
  });
  wall.addEventListener('pointermove', e => { px = e.clientX; py = e.clientY;
    if (!drag){ if (timer && Math.hypot(px - sx, py - sy) > 8) cancelPress(); return; }
    e.preventDefault(); place(); });
  wall.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive:false });
  const end = () => { cancelPress(); if (!drag) return; cancelAnimationFrame(raf);
    const changed = drag.order.join() !== al.workIds.join(); al.workIds = drag.order; drag.el.classList.remove('lift'); wall.classList.remove('dragging'); drag = null;
    Sound.se('drop'); Sound.muteFor(200);
    if (changed){ save(); toast('並び順を保存しました'); } renderPage(true); };
  wall.addEventListener('pointerup', end); wall.addEventListener('pointercancel', end);
  wall.addEventListener('click', e => { if (suppress){ e.stopPropagation(); e.preventDefault(); suppress = false; } }, true);
  wall.addEventListener('contextmenu', e => { if (e.target.closest('.w[data-wid]')) e.preventDefault(); });
}

function simulatePass(){
  const s = S.settings; rollDay();
  if (S.passLog.count >= s.dailyLimit){ toast(`今日は上限の${s.dailyLimit}人に達しました。上限は設定で変えられます。`); return; }
  const n = Math.min(1 + Math.floor(Math.random()*2), s.dailyLimit - S.passLog.count), place = pick(PLACES); let added = 0, last;
  for (let i = 0; i < n; i++){
    let a, tries = 0; do { a = pick(ARTISTS); tries++; } while ((isBlocked(a.handle) || (s.receiveTags.length && !museumOf(a)[0].tags.some(t => s.receiveTags.includes(t)))) && tries < 40);
    if (isBlocked(a.handle) || (s.receiveTags.length && !museumOf(a)[0].tags.some(t => s.receiveTags.includes(t)))) continue;
    // 届くのは相手のサムネ。作品は相手の美術館で1点選んでもらう
    last = { id: uid(), source:'pass', place, at: Date.now() - i*1000, work: museumOf(a)[0], pickedId: null }; S.encounters.push(last); added++;
  }
  if (!added){ toast('近くにいたのは、受け取る条件に合わない人だけでした'); return; }
  S.passLog.count += added; if (s.notifyPass) notify(`${place.name}で${added}人とすれ違いました。美術館から好きな作品を1点ずつもらえます`, null, last.id);

}

async function readImage(file){
  if (!file || !file.type.startsWith('image/')) throw new Error('画像ファイル（JPG・PNGなど）を選んでください。');
  const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(new Error('画像を読み込めませんでした。別の画像で試してください。')); fr.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('この画像は開けませんでした。JPGかPNGで試してください。')); im.src = url; });
  const k = Math.min(1, 1100 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return { img: c.toDataURL('image/jpeg', .82), aspect: [c.width, c.height] };
}

  if (id === 'ftitle') $('#tcnt').textContent = `${e.target.value.length}/30`;
  if (id === 'fcap') $('#ccnt').textContent = `${e.target.value.length}/500`;
  if (id === 'ftag' && !e.isComposing){ syncForm(); const pos = e.target.selectionStart; renderPage(true); const i = $('#ftag'); i.focus(); i.setSelectionRange(pos, pos); }
});
document.addEventListener('compositionend', e => { if (e.target.id === 'ftag') e.target.dispatchEvent(new Event('input', { bubbles:true })); });
document.addEventListener('keydown', e => {
  if (e.target.id === 'ftag' && e.key === 'Enter' && !e.isComposing){ e.preventDefault(); const v = e.target.value.replace(/^#/, '').trim(); if (v){ syncForm(); const P = topPage(); if (P.draft.tags.length < 5 && !P.draft.tags.includes(v)) P.draft.tags.push(v); P.draft.q = ''; renderPage(true); $('#ftag').focus(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('div[role=button][data-act]')){ e.preventDefault(); e.target.click(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.id === 'stage' && UI.gPhase === 'tap'){ e.preventDefault(); crack(); }
  if (e.key === 'Escape'){ if ($('#fx').innerHTML){ closeFx(); endGacha(); if (UI.tab === 'gacha') render(); } else if (UI.pages.length) pop(); }
});
document.addEventListener('change', e => { if (e.target.id === 'file') takeFile(e.target.files[0]); });
document.addEventListener('dragover', e => { const dz = e.target.closest?.('#drop'); if (dz){ e.preventDefault(); dz.classList.add('drag'); } });
document.addEventListener('dragleave', e => { e.target.closest?.('#drop')?.classList.remove('drag'); });
document.addEventListener('drop', e => { const dz = e.target.closest?.('#drop'); if (dz){ e.preventDefault(); takeFile(e.dataTransfer.files[0]); } });
document.addEventListener('submit', e => {
  e.preventDefault(); const P = topPage();
  if (e.target.id === 'workForm'){
    syncForm(); const d = P.draft, er = $('#ferr');
    const msg = !d.img && d.seed == null ? '作品の画像を選んでください。' : !d.title.trim() ? 'タイトルを入力してください。' : !d.tags.length ? 'タグを1つ以上つけてください。' : '';
    if (msg){ er.textContent = msg; er.hidden = false; return; }
    const data = { title: d.title.trim(), desc: d.desc.trim(), tags: d.tags.slice(), aspect: d.aspect, img: d.img || undefined, seed: d.img ? undefined : d.seed, style: d.style };
    let id = P.id;
    let al = null;
    if (id) Object.assign(S.myWorks.find(w => w.id === id), data);
    else { id = uid(); S.myWorks.unshift({ id, at: Date.now(), ...data }); al = S.albums.find(a => a.id === d.albumId) || S.albums[0]; al.workIds.push(id); }
    al = al || S.albums.find(a => a.workIds.includes(id)) || S.albums[0];
    const wasThumb = al.thumbId === id;
    if (d.thumb) al.thumbId = id; else if (wasThumb) al.thumbId = al.workIds.find(x => x !== id) || null;
    pinThumb(al); syncThumb();
    save(); pop(); toast(d.thumb && !wasThumb ? `「${al.name}」のサムネにして、左上に移しました` : P.id ? '作品を更新しました' : `「${al.name}」に作品を追加しました`);
  }
  if (e.target.id === 'albumForm'){
    const name = $('#albumName').value.trim() || `展示室${S.albums.length + 1}`;
    const al = { id: 'a' + uid(), name, workIds: [] }; S.albums.push(al); save(); closeFx(); render();
    push({ type:'museum', kind:'mine', view:'wall', albumId: al.id }); toast(`展示室「${name}」を作りました`); return;
  }
  if (e.target.id === 'profForm'){
    const name = $('#pname').value.trim(), handle = $('#phandle').value.trim(), bio = $('#pbio').value, er = $('#perr');
    const msg = !name ? '名前を入力してください。' : !/^[A-Za-z0-9._]{3,24}$/.test(handle) ? 'ユーザーネームは半角英数字・ピリオド・アンダーバーで3〜24文字にしてください。' : '';
    if (msg){ er.textContent = msg; er.hidden = false; return; }
    Object.assign(S.me, { name, handle, bio, avatarSeed: P.form.avatarSeed }); save(); pop(); toast('プロフィールを保存しました');
  }
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (UI.tab === 'home' && !UI.pages.length) render(); }, 200); });

render();
</script>
